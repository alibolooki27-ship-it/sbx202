<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>آرمین منصوری | استریمر حرفه‌ای</title><style>:root{--bg:#0f172a;--glass:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);--accent:#38bdf8;--txt:#f8fafc}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;outline:none !important}body{background:radial-gradient(circle at 50% 0%,#1e293b,var(--bg));color:var(--txt);min-height:100vh;display:flex;justify-content:center;padding:40px 20px}.card{width:100%;max-width:800px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:40px;padding:50px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)}.hero{text-align:center;margin-bottom:50px}.h1{font-size:3rem;margin-bottom:10px;background:linear-gradient(to right,#fff,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.desc{color:#94a3b8;line-height:1.8;margin-top:20px}.box{background:var(--glass);padding:30px;border-radius:25px;margin-bottom:20px;border:1px solid var(--border)}.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:30px}.btn{padding:18px;border-radius:20px;text-decoration:none;text-align:center;font-weight:bold;transition:0.3s;background:var(--accent);color:#000}.btn:hover{transform:scale(1.02);filter:brightness(1.2)}.faq-f{position:fixed;bottom:30px;right:30px;width:60px;height:60px;background:var(--accent);border-radius:20px;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 25px var(--accent);z-index:99}.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);display:grid;place-items:center;opacity:0;visibility:hidden;transition:0.4s;padding:20px;z-index:100}.overlay.open{opacity:1;visibility:visible}.modal{background:#1e293b;width:100%;max-width:500px;padding:30px;border-radius:30px;transform:scale(0.8);transition:0.4s}.overlay.open .modal{transform:scale(1)}</style></head><body><main class="card"><header class="hero"><h1 class="h1">آرمین منصوری</h1><p>استریمر و تولیدکننده محتوا</p></header><section><div class="box"><h2>درباره من</h2><p class="desc">گیمر، استریمر و همراه شما در دنیای هیجان‌انگیز فری‌فایر. با من همراه باشید تا در کانال آپارات استریم‌های متفاوت و آموزش‌های حرفه‌ای را تجربه کنید.</p></div></section><nav class="btn-group"><a href="#" class="btn">تلگرام</a><a href="#" class="btn">آپارات</a></nav></main><div class="faq-f" id="openFaq">?</div><div class="overlay" id="faqOverlay"><div class="modal"><h3>سوالات متداول</h3><p style="margin:20px 0;opacity:0.8">ساعات استریم: هر شب ساعت ۲۱</p><button class="btn" id="closeFaq" style="width:100%">بستن</button></div></div><script>const o=document.getElementById("faqOverlay");document.getElementById("openFaq").onclick=()=>o.classList.add("open");document.getElementById("closeFaq").onclick=()=>o.classList.remove("open");</script></body></html>
