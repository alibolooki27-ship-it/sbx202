<!DOCTYPE html><html dir="rtl" lang="fa"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فروشگاه حرفه‌ای</title><style>:root{--main:#ef394e;--gray:#f0f2f5;--dark:#232529}body{margin:0;font-family:Tahoma,sans-serif;background-color:var(--gray)}header{position:sticky;top:0;background:#fff;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 5px rgba(0,0,0,.1);z-index:1000}.search-box{flex:1;margin:0 20px;position:relative}.search-box input{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;background:#f0f2f5}.hero{padding:20px;text-align:center;background:#fff;margin:20px;border-radius:15px;min-height:200px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ef394e,#a11d2e);color:#fff}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;padding:20px}.card{background:#fff;padding:15px;border-radius:12px;text-align:center;transition:.3s;border:1px solid #eee}.card:hover{box-shadow:0 5px 15px rgba(0,0,0,.1);transform:translateY(-5px)}.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}.price{color:var(--main);font-weight:bold;margin:10px 0}button{width:100%;padding:10px;background:var(--main);color:#fff;border:none;border-radius:6px;cursor:pointer}footer{padding:20px;text-align:center;color:#666;font-size:12px}</style></head><body><header><div class="logo">فروشگاه شما</div><div class="search-box"><input type="text" placeholder="جستجو در محصولات..."></div><div class="user-panel">ورود / ثبت‌نام</div></header><main><div class="hero"><h1>بهترین محصولات، با بهترین قیمت</h1></div><section class="product-grid"><div class="card"><img src="https://picsum.photos/200" alt="product"><p>گوشی موبایل مدل پرو</p><div class="price">۲۵,۰۰۰,۰۰۰ تومان</div><button>افزودن به سبد</button></div><div class="card"><img src="https://picsum.photos/201" alt="product"><p>لپ‌تاپ گیمینگ سری X</p><div class="price">۴۵,۰۰۰,۰۰۰ تومان</div><button>افزودن به سبد</button></div><div class="card"><img src="https://picsum.photos/202" alt="product"><p>ساعت هوشمند مدل جدید</p><div class="price">۲,۵۰۰,۰۰۰ تومان</div><button>افزودن به سبد</button></div><div class="card"><img src="https://picsum.photos/203" alt="product"><p>هدفون بی سیم حرفه‌ای</p><div class="price">۱,۲۰۰,۰۰۰ تومان</div><button>افزودن به سبد</button></div></section></main><footer>تمامی حقوق محفوظ است - نسخه 1.0</footer></body></html>
