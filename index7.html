<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قالب فروشگاهی هایلند</title><style>body{font-family:Tahoma,sans-serif;background:#f9f9f9;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}#highland-card{background:#fff;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,.1);padding:30px;width:350px;text-align:center;transition:transform .3s}#highland-card:hover{transform:translateY(-5px)}img{width:100%;border-radius:10px;margin-bottom:20px}.btn{display:block;width:100%;padding:12px;margin:10px 0;border-radius:25px;border:0;cursor:pointer;font-weight:bold;transition:background .3s}#build-btn{background:#e74c3c;color:#fff}#build-btn:hover{background:#c0392b}#preview-btn{background:#7f8c8d;color:#fff}#preview-btn:hover{background:#34495e}</style></head><body><div id="highland-card"><h2>قالب فروشگاهی هایلند</h2><img src="https://see5.net/assets/images/templates/highland.jpg" alt="قالب فروشگاهی هایلند"><button id="build-btn" class="btn" onclick="action('ساخت')">ساخت سایت</button><button id="preview-btn" class="btn" onclick="action('پیش‌نمایش')">پیش‌نمایش</button></div><script>function action(type){alert(type+' سایت با موفقیت انتخاب شد!');console.log(type+' triggered');}</script></body></html>
