<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="نمونه رابط کاربری یک پلتفرم قانونی برای کشف و دریافت موسیقی مستقل">
  <title>نوا | کشف موسیقی مستقل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b14;
      --panel: #121522;
      --panel-2: #181c2c;
      --line: rgba(255, 255, 255, .09);
      --text: #f7f7fb;
      --muted: #a9adbd;
      --purple: #8b5cf6;
      --pink: #f472b6;
      --aqua: #2dd4bf;
      --yellow: #fbbf24;
      --shadow: 0 18px 52px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      font-family: "Vazirmatn", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 7% 0%, rgba(139, 92, 246, .20), transparent 25rem),
        radial-gradient(circle at 92% 15%, rgba(45, 212, 191, .12), transparent 23rem),
        var(--bg);
      padding-bottom: 104px;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1180px, calc(100% - 40px)); margin: auto; }

    .topbar {
      position: sticky; top: 0; z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(9, 11, 20, .78);
      backdrop-filter: blur(18px);
    }
    .topbar__inner { height: 78px; display: flex; align-items: center; gap: 28px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; flex: 0 0 auto; font-size: 23px; font-weight: 800; letter-spacing: -.8px; }
    .brand__mark { width: 34px; height: 34px; display: grid; place-items: center; color: #110b20; background: linear-gradient(135deg, var(--pink), var(--purple) 50%, var(--aqua)); border-radius: 12px 12px 5px 12px; box-shadow: 0 7px 20px rgba(139, 92, 246, .42); }
    .brand__mark svg { width: 19px; height: 19px; }
    .nav { display: flex; align-items: center; gap: 24px; color: var(--muted); font-size: 14px; font-weight: 500; }
    .nav a { transition: color .2s ease; }
    .nav a:hover, .nav a.active { color: var(--text); }
    .nav .active { position: relative; }
    .nav .active::after { content: ""; position: absolute; right: 0; left: 0; bottom: -9px; height: 2px; border-radius: 3px; background: var(--pink); }
    .header-actions { display: flex; gap: 10px; align-items: center; margin-inline-start: auto; }
    .icon-button, .menu-button { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; color: var(--text); background: rgba(255,255,255,.035); transition: transform .2s, background .2s; }
    .icon-button:hover, .menu-button:hover { background: rgba(255,255,255,.1); transform: translateY(-2px); }
    .icon-button svg, .menu-button svg { width: 18px; height: 18px; }
    .user { padding: 7px 11px 7px 8px; display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.035); color: var(--muted); font-size: 12px; }
    .avatar { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 9px; color: #fff; font-size: 11px; font-weight: 700; background: linear-gradient(135deg, #f59e0b, #ef4444); }
    .menu-button { display: none; }

    .hero { padding: 50px 0 28px; display: grid; grid-template-columns: 1.35fr .8fr; gap: 32px; align-items: stretch; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid rgba(244, 114, 182, .26); border-radius: 99px; background: rgba(244, 114, 182, .08); color: #f9a8d4; font-size: 12px; font-weight: 600; }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 5px rgba(244, 114, 182, .16); }
    h1 { max-width: 690px; margin: 18px 0 14px; font-size: clamp(31px, 4vw, 52px); line-height: 1.28; letter-spacing: -1.7px; }
    h1 strong { color: #d8c5ff; font-weight: 800; }
    .hero p { max-width: 605px; margin: 0; color: var(--muted); line-height: 2; font-size: 15px; }
    .search-wrap { max-width: 630px; margin-top: 28px; display: flex; align-items: center; gap: 10px; padding: 7px 7px 7px 15px; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; background: rgba(18,21,34,.85); box-shadow: var(--shadow); }
    .search-wrap:focus-within { border-color: rgba(139, 92, 246, .65); box-shadow: 0 0 0 4px rgba(139, 92, 246, .11), var(--shadow); }
    .search-icon { width: 20px; flex: 0 0 20px; color: #8f93a6; }
    .search-wrap input { width: 100%; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 14px; }
    .search-wrap input::placeholder { color: #7c8195; }
    .kbd { padding: 3px 7px; border: 1px solid var(--line); border-bottom-color: rgba(255,255,255,.18); border-radius: 6px; color: #9298aa; direction: ltr; font-family: Arial, sans-serif; font-size: 11px; white-space: nowrap; }
    .hero-note { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; color: #9298a9; font-size: 12px; }
    .hero-note span { display: inline-flex; align-items: center; gap: 5px; }
    .hero-note svg { width: 15px; height: 15px; color: var(--aqua); }

    .featured {
      position: relative; isolation: isolate; overflow: hidden; min-height: 320px; padding: 26px; border: 1px solid rgba(255,255,255,.12); border-radius: 26px; background: linear-gradient(145deg, rgba(74, 37, 129, .98), #18112c 58%, #111827); box-shadow: var(--shadow); }
    .featured::before { content: ""; position: absolute; z-index: -1; left: -52px; bottom: -66px; width: 250px; height: 250px; border-radius: 50%; background: repeating-radial-gradient(circle, rgba(255,255,255,.13) 0 1px, transparent 2px 12px); transform: rotate(-25deg); opacity: .62; }
    .featured::after { content: ""; position: absolute; z-index: -1; top: -78px; left: -25px; width: 190px; height: 190px; border-radius: 50%; background: #e879f9; filter: blur(40px); opacity: .37; }
    .featured__top { display: flex; justify-content: space-between; color: #e9ddff; font-size: 12px; }
    .featured__label { display: inline-flex; align-items: center; gap: 7px; }
    .featured__label svg { width: 16px; height: 16px; color: #fde68a; }
    .featured__art { position: absolute; left: 24px; bottom: 22px; width: 130px; height: 130px; border: 8px solid rgba(255,255,255,.12); border-radius: 50%; background: conic-gradient(from 25deg, #e879f9, #f9a8d4, #a78bfa, #60a5fa, #e879f9); box-shadow: 0 18px 30px rgba(0,0,0,.27); }
    .featured__art::before { content: ""; position: absolute; inset: 27px; border-radius: 50%; background: #211542; border: 3px solid rgba(255,255,255,.26); }
    .featured__art::after { content: ""; position: absolute; top: 55px; right: 55px; width: 12px; height: 12px; border-radius: 50%; background: #f5d0fe; }
    .featured__content { position: absolute; right: 26px; bottom: 24px; width: calc(100% - 184px); }
    .featured h2 { margin: 6px 0 2px; font-size: 24px; letter-spacing: -.7px; }
    .featured p { margin: 0; color: #d8c7ef; font-size: 13px; }
    .featured__play { width: 44px; height: 44px; margin-top: 15px; display: grid; place-items: center; border: 0; border-radius: 14px; color: #38154e; background: #f5d0fe; box-shadow: 0 8px 18px rgba(0,0,0,.2); transition: transform .2s; }
